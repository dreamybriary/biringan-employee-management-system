<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Biri-Go</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/statistics/css/admin.css">
    <link rel="stylesheet" href="/statistics/css/login.css">
</head>
<body class="login-body">
    <main class="login-wrapper">
        <section class="login-card">
            <div class="login-brand">
                <div class="login-logo"><i class="fas fa-users"></i></div>
                <h1>Biri-Go</h1>
                
            </div>

            <form id="login-form" novalidate>
                <h2>Welcome back</h2>
                <p class="login-sub">Sign in to your account to continue.</p>

                <div id="login-alert" class="login-alert" role="alert" hidden></div>

                <div class="field">
                    <label for="employee-code">Employee ID</label>
                    <div class="input-wrap">
                        <i class="fas fa-id-badge"></i>
                        <input type="text" id="employee-code" name="employee_code" placeholder="biri-123456" maxlength="11" autocomplete="off" required>
                    </div>
                    <small class="field-error" id="code-error"></small>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" id="toggle-password" class="toggle-btn" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="field-error" id="password-error"></small>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="#" id="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary login-submit">
                    <i class="fas fa-right-to-bracket"></i> <span>Log In</span>
                </button>
            </form>

            <p class="login-footer">&copy; 2026 Biri-Go</p>
        </section>
    </main>
    <script src="/statistics/js/login.js"></script>
</body>
</html>
