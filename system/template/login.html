        <!-- Right: sign in -->
        <section class="form-panel">
            <div class="login-card" id="login-card">
                <form id="login-form" novalidate>
                    <header class="form-header">
                        <h1 class="form-title">Sign in</h1>
                        <p class="form-sub">Welcome back. Sign in to access the Biringan employee portal.</p>
                    </header>

                    <noscript>
                        <div class="login-alert error">JavaScript is required to log in.</div>
                    </noscript>

                    <div id="login-alert" class="login-alert" role="alert" aria-live="assertive" hidden>
                        <i class="fas fa-circle-exclamation" id="alert-icon" aria-hidden="true"></i>
                        <span id="alert-text"></span>
                    </div>

                    <div class="field">
                        <label for="employee-code">Employee ID</label>
                        <div class="input-wrap">
                            <input type="text" id="employee-code" name="employee_code"
                                   placeholder="biri-123456" maxlength="11"
                                   inputmode="numeric" autocomplete="username"
                                   autocapitalize="off" spellcheck="false"
                                   aria-describedby="code-hint code-error" autofocus required>
                        </div>
                        <small class="field-hint" id="code-hint">Just type the 6 digits. "biri-" is added for you.</small>
                        <small class="field-error" id="code-error" aria-live="polite"></small>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <div class="input-wrap">
                            <input type="password" id="password" name="password"
                                   placeholder="Enter your password"
                                   autocomplete="current-password"
                                   aria-describedby="password-error caps-warning" required>
                            <button type="button" id="toggle-password" class="toggle-btn" aria-label="Show password">Show</button>
                        </div>
                        <small class="caps-warning" id="caps-warning" hidden>
                            <i class="fas fa-arrow-up" aria-hidden="true"></i> Caps Lock is on
                        </small>
                        <small class="field-error" id="password-error" aria-live="polite"></small>
                    </div>

                    <div class="login-options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            <span>Remember my Employee ID</span>
                        </label>
                        <a href="#" id="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" id="login-btn" class="btn btn-primary login-submit">
                        <span class="spinner" id="login-spinner" hidden aria-hidden="true"></span>
                        <span id="login-label">Sign in</span>
                    </button>
                </form>
            </div>

            <p class="login-footer">&copy; 2026 Biri-Go</p>
        </section>

    </main>
    <script src="/statistics/js/login.js"></script>
</body>
